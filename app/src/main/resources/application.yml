server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:mem:devdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  profiles:
    default: dev
  application:
    name: app
  output:
    ansi:
      enabled: always
